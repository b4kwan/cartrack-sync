name: Cartrack to Odoo Daily Sync

on:
  schedule:
    # Berjalan otomatis setiap pukul 00:00 WIB (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual

jobs:
  sync-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Synchronization Script
        run: python sync.py